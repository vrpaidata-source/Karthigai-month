<script>
const params=new URLSearchParams(location.search);
const senderFromLink=params.get('sender')||'';const wishFromLink=params.get('wish')||'';
if(senderFromLink)document.getElementById('senderName').textContent=senderFromLink;
if(wishFromLink)document.getElementById('wishText').textContent=wishFromLink;

document.getElementById('shareBtn').addEventListener('click', async () => {
  const sender = prompt('உங்கள் பெயரை உள்ளிடவும்:');

  if (sender === null) return;

  const name = sender.trim();

  if (!name) {
    alert('தயவுசெய்து பெயரை உள்ளிடவும்.');
    return;
  }

  try {
    const shareUrl = new URL(location.href);
    shareUrl.search = '';
    shareUrl.searchParams.set('sender', name);

    const message = 'ஐயப்ப சுவாமியின் அருளுடன் வாழ்த்து மடலைத் திறக்கவும்.';

    if (navigator.share) {
      await navigator.share({
        title: 'ஐயப்பன் வாழ்த்து மடல்',
        text: message,
        url: shareUrl.href
      });
    } else {
      await navigator.clipboard.writeText(
        message + '\n' + shareUrl.href
      );
      alert('இணைப்பு Copy செய்யப்பட்டது. பகிரலாம்!');
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      const shareUrl = new URL(location.href);
      shareUrl.search = '';
      shareUrl.searchParams.set('sender', name);

      prompt('இணைப்பை Copy செய்து பகிரவும்:', shareUrl.href);
    }
  }
});

</script>

function playNote(frequency) {
  const osc = audioContext.createOscillator();

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start();
  osc.stop(audioContext.currentTime + 0.85);
}

async function startMusic() {
  if (!audioContext) {
    audioContext = new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  await audioContext.resume();

  playing = true;
  musicBtn.textContent = "♫ இசை OFF";

  musicTimer = setInterval(() => {
    playNote(notes[noteIndex]);
    noteIndex = (noteIndex + 1) % notes.length;
  }, 650);
}

function stopMusic() {
  playing = false;
  clearInterval(musicTimer);
  musicBtn.textContent = "♫ இசை ON";
}

musicBtn.addEventListener("click", async () => {
  if (playing) {
    stopMusic();
  } else {
    await startMusic();
  }
});
</script>

</body></html>
